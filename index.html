<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="referrer" content="no-referrer">
<title>Call</title>
<style>
html,body{height:100%;margin:0}
body{background:#002E34;color:#E6F2F2;font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:flex;align-items:center;justify-content:center}
main{width:min(420px,100%);padding:28px 20px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.k{margin:0;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#9DBFC2}
h1{margin:0;font-size:24px;line-height:1.2;color:#fff;overflow-wrap:anywhere}
.n{margin:0 0 8px;font-size:30px;font-weight:700;letter-spacing:.02em;color:#B5FF98}
.b{display:block;box-sizing:border-box;width:100%;padding:15px 16px;border-radius:14px;border:1px solid #0B4449;background:#0B4449;color:#fff;font:inherit;font-weight:600;text-align:center;text-decoration:none;cursor:pointer}
.b.p{background:#B5FF98;border-color:#B5FF98;color:#04201A;font-size:18px}
.b.q{background:none;color:#9DBFC2}
.h{margin:6px 0 0;font-size:13.5px;color:#9DBFC2}
[hidden]{display:none}
</style>
</head>
<body>
<main>
<p class="k">Call</p>
<h1 id="who">No number given</h1>
<p class="n" id="num"></p>
<a class="b p" id="call" hidden>Call now</a>
<a class="b" id="sc" hidden>Save contact and call</a>
<a class="b" id="vcf" hidden>Save to Contacts</a>
<button class="b q" id="x" type="button">Close</button>
<p class="h" id="hint">This page only works when opened from a Call button.</p>
</main>
<script>
/* Everything arrives after the # in the link, which the browser never sends to any server.
   n = number, name = person, org = business, email, addr, note, m = "sc" to run the shortcut instead of the plain dialler, s = shortcut name. */
(function(){
  var q={};location.hash.replace(/^#/,"").split("&").forEach(function(p){var i=p.indexOf("=");if(i>0){try{q[p.slice(0,i)]=decodeURIComponent(p.slice(i+1).replace(/\+/g,"%20"))}catch(e){}}});
  var clean=function(s){return String(s||"").replace(/[\r\n]+/g," ").slice(0,300)};
  var n=String(q.n||"").replace(/[^\d+]/g,"").slice(0,20),name=clean(q.name),org=clean(q.org),email=clean(q.email),addr=clean(q.addr),note=clean(q.note);
  var scName=clean(q.s)||"CRM Dial";
  document.getElementById("x").onclick=function(){try{window.close()}catch(e){}history.length>1&&history.back()};
  if(!n)return;
  try{history.replaceState(null,"",location.pathname)}catch(e){}
  document.title="Call "+(org||name||n);
  document.getElementById("who").textContent=org||name||"Call";
  document.getElementById("num").textContent=n;
  var tel="tel:"+n;
  var payload=[n,name,org,email,addr,note,q.k==="1"?"KNOWN":"NEW"].join("\n");
  var scUrl="shortcuts://run-shortcut?name="+encodeURIComponent(scName)+"&input=text&text="+encodeURIComponent(payload);
  var call=document.getElementById("call");call.href=tel;call.hidden=false;
  var sc=document.getElementById("sc");sc.href=scUrl;sc.hidden=false;
  var esc=function(s){return String(s).replace(/\\/g,"\\\\").replace(/([,;])/g,"\\$1")};
  var parts=name.split(/\s+/).filter(Boolean);
  var v=["BEGIN:VCARD","VERSION:3.0","FN:"+esc(name?name+(org?" ("+org+")":""):org||n),"N:"+(name?esc(parts.slice(1).join(" "))+";"+esc(parts[0]):esc(org||n)+";")+";;;"];
  if(org)v.push("ORG:"+esc(org));v.push("TEL;TYPE=WORK,VOICE:"+n);if(email.indexOf("@")>0)v.push("EMAIL;TYPE=WORK:"+esc(email));if(addr)v.push("ADR;TYPE=WORK:;;"+esc(addr)+";;;;");if(note)v.push("NOTE:"+esc(note));v.push("END:VCARD");
  var vc=document.getElementById("vcf");vc.href="data:text/vcard;charset=utf-8,"+encodeURIComponent(v.join("\r\n")+"\r\n");vc.hidden=false;
  var useSc=q.m==="sc";
  document.getElementById("hint").textContent=useSc?"Your shortcut should open by itself. If it does not, tap Save contact and call.":"Your iPhone should ask to call straight away. If it does not, tap Call now.";
  setTimeout(function(){try{location.href=useSc?scUrl:tel}catch(e){}},150);
})();
</script>
</body>
</html>
